name: Release

on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Validate and publish release
    runs-on: ubuntu-latest
    # A tag and its main-branch CI are both push-triggered. Reserve enough
    # time for the release job to wait for the exact-commit CI rather than
    # racing it and reporting a false release failure.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate release version metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:validate
      - name: Require the tagged commit on main
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Wait for successful CI for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const deadlineAt = Date.now() + 15 * 60 * 1000;
            const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
            while (true) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "ci.yml",
                head_sha: context.sha,
                per_page: 20,
              });
              if (data.workflow_runs.some((run) => run.conclusion === "success")) return;
              const running = data.workflow_runs.some((run) => run.status !== "completed");
              const failed = data.workflow_runs.find((run) => run.status === "completed" && run.conclusion && run.conclusion !== "success");
              if (!running && failed) {
                core.setFailed(`CI for this exact tagged commit concluded ${failed.conclusion}.`);
                return;
              }
              if (Date.now() >= deadlineAt) {
                core.setFailed("A successful CI run for this exact tagged commit was not available within 15 minutes.");
                return;
              }
              await sleep(15_000);
            }
      - name: Create or update GitHub Release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const fs = require("fs");
            const version = process.env.RELEASE_TAG.slice(1);
            const notesPath = `docs/releases/v${version}.md`;
            if (!fs.existsSync(notesPath)) core.setFailed(`Missing required release notes: ${notesPath}`);
            const body = fs.readFileSync(notesPath, "utf8");
            const release = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.RELEASE_TAG,
              target_commitish: context.sha,
              name: process.env.RELEASE_TAG,
              body,
              draft: false,
              prerelease: false,
            };
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.RELEASE_TAG,
              });
              await github.rest.repos.updateRelease({ ...release, release_id: existing.data.id });
            } catch (error) {
              if (error?.status !== 404) throw error;
              await github.rest.repos.createRelease(release);
            }
