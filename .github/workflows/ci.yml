name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["24.19.0", "26.5.0"]
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Windows npm-cache compression can exhaust the job timeout after all
      # verification has passed. Caching is optional; verification is not.
      - if: runner.os == 'Windows'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run release:validate
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        run: npx playwright install chromium
      - run: npm run verify
      - run: npm run release:pack

  retrieval-gate:
    # Fixed LongMemEval_S subset through automatic recall, lexical only, no
    # model calls; fails when evidence recall drops or wrong attachment rises
    # beyond eval/retrieval-gate/baseline.json (default budget),
    # baseline-4000.json (large budget, adaptive fill) or the Chinese
    # baseline-zh*.json. One platform: the run is deterministic and the
    # baseline is per-question.
    name: retrieval gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: dataset
        run: |
          echo "url=$(node -p "require('./eval/retrieval-gate/baseline.json').dataset.url")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(node -p "require('./eval/retrieval-gate/baseline.json').dataset.sha256")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .tmp/datasets
          key: longmemeval-s-${{ steps.dataset.outputs.sha256 }}
      - name: Download LongMemEval_S (MIT)
        run: |
          mkdir -p .tmp/datasets
          f=.tmp/datasets/longmemeval_s_cleaned.json
          if ! echo "${{ steps.dataset.outputs.sha256 }}  $f" | sha256sum -c --status 2>/dev/null; then
            curl -fsSL --retry 3 -o "$f" "${{ steps.dataset.outputs.url }}"
            echo "${{ steps.dataset.outputs.sha256 }}  $f" | sha256sum -c
          fi
      - run: npm run -s eval:retrieval-gate -- .tmp/datasets/longmemeval_s_cleaned.json
      - run: npm run -s eval:retrieval-gate -- .tmp/datasets/longmemeval_s_cleaned.json --baseline eval/retrieval-gate/baseline-4000.json
      # Chinese: the gate's questions on a reduced, machine-translated subset
      # kept in the repository (scripts/build-zh-gate-dataset.mjs).
      - run: npm run -s eval:retrieval-gate -- eval/retrieval-gate/longmemeval-s-zh.json.gz --baseline eval/retrieval-gate/baseline-zh.json
      - run: npm run -s eval:retrieval-gate -- eval/retrieval-gate/longmemeval-s-zh.json.gz --baseline eval/retrieval-gate/baseline-zh-4000.json
